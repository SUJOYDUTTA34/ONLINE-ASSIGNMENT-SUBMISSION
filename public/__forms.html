<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Scholaris Forms</title>
  </head>
  <body>
    <form name="scholaris-contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="scholaris-contact" />
      <input type="hidden" name="subject" value="New Scholaris support message" />
      <input name="name" />
      <input name="email" type="email" />
      <select name="topic"><option value="General enquiry">General enquiry</option></select>
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
